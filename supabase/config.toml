# The "Set up Supabase" GitHub Action rewrites this from the
# SUPABASE_PROJECT_REF secret at run time, so the two cannot drift apart.
# It matters here for anyone running the CLI locally.
project_id = "ugbjwgfmsrkclrzpfwgz"

# Edge Functions. These replace the TanStack Start server functions and API
# routes the app used to depend on, so the CRM can ship as a standalone app with
# no web server of its own.

# Called by the signed-in app; the caller's JWT is verified by the platform and
# again inside the function.
[functions.create-invoice]
verify_jwt = true

# Re-derives a draft invoice's lines. Signed in only: it rewrites the money on
# a document, and refuses outright once that document has been sent.
[functions.rebuild-invoice]
verify_jwt = true

[functions.send-invoice-email]
verify_jwt = true

[functions.email-status]
verify_jwt = true

[functions.send-test-email]
verify_jwt = true

[functions.send-quote-email]
verify_jwt = true

# Called by the signed-in app while a client address is being typed. It proxies
# a metered third-party lookup, so it is not left open to the internet.
[functions.address-lookup]
verify_jwt = true

# Cloud fallback for the voice assistant. Holds the OpenAI key server-side,
# runs the pricing/quote tools, and returns one spoken sentence. Signed in
# only, so the endpoint cannot be used as a free token faucet.
[functions.voice-route]
verify_jwt = true

# Public: the customer-facing enquiry form posts here from any website, so there
# is no JWT to verify. Protected by the owner's enquiry_key and a honeypot field.
[functions.public-enquiry]
verify_jwt = false

# Scheduled: guarded by the service-role key inside the function rather than by
# a user JWT, so only the cron job can trigger a reminder run.
[functions.payment-reminders]
verify_jwt = false

# Public: the customer opens their quote from an emailed link and accepts or
# declines it without an account. The quotes table has no anon policy, so this
# function is the only way that data is reachable.
[functions.public-quote]
verify_jwt = false

# Public: Resend posts delivery reports here and has no JWT to present. Every
# request is checked against RESEND_WEBHOOK_SECRET before anything is written.
[functions.resend-webhook]
verify_jwt = false

# Called by the signed-in app from Settings: starts the Monzo connection,
# reports its state, switches account, disconnects. Holds no secrets of its own
# but reads a table that only service_role may see.
[functions.monzo-connect]
verify_jwt = true

# Public: Monzo redirects the account holder's browser here at the end of the
# OAuth flow, and a browser arriving from another site carries no JWT. The
# signed `state` parameter is what proves the round trip started in the app.
[functions.monzo-callback]
verify_jwt = false

# Called by the app's "Sync now", and by the nightly cron with the service-role
# key. Which one is calling is worked out inside the function.
[functions.monzo-sync]
verify_jwt = false

# Public: Monzo posts transactions here and has no JWT. Monzo does not sign its
# webhooks either, so the URL carries a secret token and every payload is read
# back from the Monzo API before it is believed.
[functions.monzo-webhook]
verify_jwt = false
