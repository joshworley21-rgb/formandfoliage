name: Native Android APK

# Builds the Kotlin/Jetpack Compose rewrite on GitHub's runners, so the APK
# does not need to be compiled on the small local machine.
#
# Signing: the native app uses the same application id as the Capacitor app
# (`uk.co.jwgardenservices.crm`), so it can reuse the committed signing key at
# android/keystore/release.jks. If that key is present (and the password secret
# is set), this produces a signed release APK that installs over previous
# builds. Without a key it falls back to a debug APK.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish the APK as a GitHub release with this tag (for example v1). Leave empty to only build."
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "native-android/**"
      - ".github/workflows/native-android.yml"
  pull_request:
    paths:
      - "native-android/**"
      - ".github/workflows/native-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      COMMITTED_KEYSTORE: android/keystore/release.jks

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      # Phonon 31m is a Rust runtime (libptts_ffi.so) with no Maven artifact.
      # Build it for arm64 here, so no native binary is committed.
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build the Phonon native library
        run: |
          source "$HOME/.cargo/env"
          cargo install cargo-ndk --locked
          yes | sdkmanager "ndk;27.0.12077973" >/dev/null
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.0.12077973"
          git clone --depth 1 --branch v0.7.1 \
            https://github.com/gradium-ai/xn-ptts.git /tmp/xn-ptts
          cd /tmp/xn-ptts
          ./android/build.sh
          mkdir -p "$GITHUB_WORKSPACE/native-android/app/src/main/jniLibs/arm64-v8a"
          cp android/jniLibs/arm64-v8a/libptts_ffi.so \
            "$GITHUB_WORKSPACE/native-android/app/src/main/jniLibs/arm64-v8a/"

      # whisper.cpp is C++ with no Maven artifact. Build the JNI layer for arm64
      # here from a pinned tag, so no native binary or vendor source is committed.
      - name: Build the whisper.cpp native library
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.0.12077973"
          git clone --depth 1 --branch v1.8.2 \
            https://github.com/ggml-org/whisper.cpp.git /tmp/whisper.cpp
          cmake -S native-android/whisper-jni -B /tmp/whisper-build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release -DWHISPER_DIR=/tmp/whisper.cpp
          cmake --build /tmp/whisper-build --target whisper_jni -j"$(nproc)"
          mkdir -p native-android/app/src/main/jniLibs/arm64-v8a
          cp /tmp/whisper-build/libwhisper_jni.so native-android/app/src/main/jniLibs/arm64-v8a/

      - uses: gradle/actions/setup-gradle@v4

      - name: Find the signing key
        # Pull requests from forks cannot read repository secrets. Build a debug
        # APK there rather than failing the whole check.
        if: github.event_name != 'pull_request'
        run: |
          if [ -f "$COMMITTED_KEYSTORE" ]; then
            cp "$COMMITTED_KEYSTORE" "$RUNNER_TEMP/release.jks"
            echo "Signing with the key in the repository."
          elif [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "Signing with the key from ANDROID_KEYSTORE_BASE64."
          else
            echo "No signing key — building a debug APK."
            exit 0
          fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::A signing key is present but ANDROID_KEYSTORE_PASSWORD is not set."
            exit 1
          fi
          echo "SIGNED=true" >> "$GITHUB_ENV"

      - name: Unit tests
        working-directory: native-android
        run: |
          # Surface the compiler/test error as a check annotation: the raw log
          # needs admin rights, an annotation is readable from the API.
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m" \
            -PbundleVoices=false 2>&1 | tee /tmp/unit-tests.log || {
            status=$?
            grep -E "^e: |FAILED|Execution failed|Caused by|error:" /tmp/unit-tests.log |
              head -25 | while IFS= read -r line; do
                echo "::error title=Android build::$line"
              done
            exit $status
          }

      - name: Build signed release APK
        if: env.SIGNED == 'true'
        working-directory: native-android
        run: |
          ./gradlew :app:assembleRelease --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m" \
            -PappVersionCode=${{ github.run_number }} \
            -PappVersionName=2.0.${{ github.run_number }} \
            -PSENTRY_DSN="$SENTRY_DSN" \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="${KEY_ALIAS:-jwgardenservices}" \
            -Pandroid.injected.signing.key.password="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"

      - name: Build debug APK
        if: env.SIGNED != 'true'
        working-directory: native-android
        run: |
          ./gradlew :app:assembleDebug --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m" \
            -PappVersionCode=${{ github.run_number }} \
            -PappVersionName=2.0.${{ github.run_number }} \


      - uses: actions/upload-artifact@v6
        with:
          name: jw-crm-native-apk
          path: |
            native-android/app/build/outputs/apk/release/*.apk
            native-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Summary
        run: |
          {
            echo "### Native Android APK"
            echo ""
            if [ "$SIGNED" = "true" ]; then
              echo "Signed release build, version 2.0.${{ github.run_number }}."
              echo ""
              echo "Download it from **Artifacts** below and open it on the phone. It installs"
              echo "over previous builds signed with the same key."
            else
              echo "Debug build, version 2.0.${{ github.run_number }} — **not signed with your key**."
              echo ""
              echo "Download it from **Artifacts**. It installs, but updating over a previous"
              echo "build will not work until a signing key is present."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Only runs when started by hand with a release tag. Creates the release (or
  # replaces the APK on an existing one) so the phone can download it directly.
  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: jw-crm-native-apk
          path: apk

      - name: Publish the release
        run: |
          apk=$(find apk -name '*.apk' | head -n 1)
          [ -n "$apk" ] || { echo "::error::No APK in the build artifact."; exit 1; }
          cp "$apk" "form-and-foliage-$TAG.apk"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "form-and-foliage-$TAG.apk" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "form-and-foliage-$TAG.apk" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$TAG" --notes "Form & Foliage native Android build from $GITHUB_SHA."
          fi
