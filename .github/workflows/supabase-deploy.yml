name: Set up Supabase

# Runs the Supabase CLI on GitHub's machines so it does not have to be run on
# yours. Start it from the Actions tab (Run workflow) — that works from a phone,
# and it builds the database without pasting anything into the SQL Editor.
#
# Repository secrets it needs (Settings → Secrets and variables → Actions):
#
#   SUPABASE_ACCESS_TOKEN   a personal access token for your Supabase ACCOUNT,
#                           made at supabase.com/dashboard/account/tokens. It
#                           starts sbp_. This is not any of the project keys —
#                           not the publishable/anon key, not the service role
#                           key, not the JWT secret. Those are under Project
#                           Settings → API and do a different job.
#   SUPABASE_PROJECT_REF    the ref from your project's dashboard URL
#   SUPABASE_DB_URL         the SESSION POOLER connection string, from Project
#                           Settings → Database → Connection string → Session
#                           pooler, with your database password filled in. It
#                           contains "pooler.supabase.com". Special characters
#                           in the password are escaped automatically, so paste
#                           it exactly as the dashboard gives it.
#
#                           The pooler is needed because Supabase's direct
#                           database connections are IPv6-only and GitHub's
#                           runners have no IPv6 — a direct connection fails
#                           with "IPv6 is not supported on your current
#                           network". The pooler answers on IPv4.
#
# The Resend key is NOT set here. It goes in the Supabase dashboard under
# Edge Functions → Secrets, so it never passes through GitHub.

on:
  workflow_dispatch:
    inputs:
      migrations:
        description: "Apply database migrations"
        type: boolean
        default: true
      functions:
        description: "Deploy the Edge Functions"
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/supabase-deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      # A push event deploys functions only; migrations stay a deliberate act.
      DO_MIGRATIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.migrations }}
      DO_FUNCTIONS: ${{ github.event_name != 'workflow_dispatch' || inputs.functions }}

    steps:
      - uses: actions/checkout@v4

      - name: Check the secrets are set
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$PROJECT_REF" ] && missing="$missing SUPABASE_PROJECT_REF"
          if [ "$DO_MIGRATIONS" = "true" ] && [ -z "$DB_URL" ]; then
            missing="$missing SUPABASE_DB_URL"
          fi
          if [ -n "$missing" ]; then
            echo "Missing repository secret(s):$missing" >&2
            echo "Add them under Settings → Secrets and variables → Actions, then run this again." >&2
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # config.toml carries a project_id, and if it names a different project
      # from the one being deployed to, the CLI follows the file rather than the
      # secret. Rewrite it so there is only one answer to "which project".
      - name: Point the config at this project
        run: |
          sed -i "s|^project_id = .*|project_id = \"$PROJECT_REF\"|" supabase/config.toml
          grep '^project_id' supabase/config.toml

      - name: Connect to the project
        run: supabase link --project-ref "$PROJECT_REF"

      # A password copied from the dashboard is plain text, but it lives in a
      # URL, where @ : / ? # and spaces mean something. Unescaped, the client
      # cannot parse the URL and blames the whole string rather than the
      # password. Fix it here instead of asking anyone to escape it by hand.
      - name: Check the database URL
        if: ${{ env.DO_MIGRATIONS == 'true' }}
        run: |
          if ! printf '%s' "$DB_URL" | python3 scripts/normalise-db-url.py > /tmp/db-url; then
            exit 1
          fi
          echo "::add-mask::$(cat /tmp/db-url)"
          echo "DB_URL_READY=$(cat /tmp/db-url)" >> "$GITHUB_ENV"

      # Builds the database on a new project, and applies anything new later.
      # Already-applied migrations are skipped, so running this twice is safe.
      # Goes through the pooler rather than the linked project's direct
      # connection, which is IPv6-only and unreachable from a GitHub runner.
      - name: Apply database migrations
        if: ${{ env.DO_MIGRATIONS == 'true' }}
        run: supabase db push --db-url "$DB_URL_READY"

      - name: Deploy the Edge Functions
        if: ${{ env.DO_FUNCTIONS == 'true' }}
        run: supabase functions deploy --project-ref "$PROJECT_REF"

      - name: Summary
        run: |
          {
            echo "### Supabase"
            echo ""
            if [ "$DO_MIGRATIONS" = "true" ]; then
              echo "- Database migrations applied"
            fi
            if [ "$DO_FUNCTIONS" = "true" ]; then
              echo "- Functions deployed:"
              ls -1 supabase/functions | grep -v '^_' | grep -v '\.md$' | sed 's/^/  - /'
            fi
            echo ""
            echo "Next: set \`RESEND_API_KEY\` in the dashboard under Edge Functions → Secrets."
          } >> "$GITHUB_STEP_SUMMARY"
